name: Supabase Keepalive

# Supabase pausiert Projekte im Free Tier nach 7 Tagen ohne API-Traffic.
# Dieser Workflow schickt 2x pro Woche einen echten Request an die REST-API,
# damit das Projekt als aktiv gilt.

on:
  schedule:
    # Montag und Donnerstag, 06:00 UTC
    - cron: '0 6 * * 1,4'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        # apikey-Header nimmt den Publishable Key (sb_publishable_...),
        # der den frueheren "anon key" ersetzt.
        run: |
          http_status=$(curl --silent --output /tmp/response.json --write-out "%{http_code}" \
            "${SUPABASE_URL}/rest/v1/" \
            -H "apikey: ${SUPABASE_PUBLISHABLE_KEY}")

          echo "HTTP status: $http_status"
          cat /tmp/response.json

          if [ "$http_status" -ge 400 ]; then
            echo "::error::Supabase keepalive ping failed with status $http_status"
            exit 1
          fi
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
