name: Supabase Keepalive

# Supabase pausiert Projekte im Free Tier nach 7 Tagen ohne API-Traffic.
# Dieser Workflow schickt 2x pro Woche einen echten Request an die REST-API,
# damit das Projekt als aktiv gilt.

on:
  schedule:
    # Montag und Donnerstag, 06:00 UTC
    - cron: '0 6 * * 1,4'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        # SUPABASE_URL ist die vollstaendige Data-API-URL aus Supabase ->
        # Integrations -> Data API (endet bereits auf /rest/v1/), wird hier
        # unveraendert verwendet. Diese Route verlangt im neuen Supabase-
        # Key-System den Secret Key (sb_secret_...), nicht den Publishable
        # Key. Der Secret Key darf hier stehen, weil er nur server-seitig
        # in Actions verwendet wird, nie im Client-Code.
        run: |
          http_status=$(curl --silent --output /tmp/response.json --write-out "%{http_code}" \
            "${SUPABASE_URL}" \
            -H "apikey: ${SUPABASE_SECRET_KEY}")

          echo "HTTP status: $http_status"
          cat /tmp/response.json

          if [ "$http_status" -ge 400 ]; then
            echo "::error::Supabase keepalive ping failed with status $http_status"
            exit 1
          fi
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
